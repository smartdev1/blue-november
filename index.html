<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novembre Bleu – Mon visuel d'engagement</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fd;--card:#fff;--fg:#0b2a5b;--mut:#5b6b88;--pri:#0a4aa8;--acc:#f47b20;--bd:#d5dfee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c30;--fg:#e8eefb;--mut:#9fb0cf;--pri:#4d8dff;--bd:#27344f}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c30;--fg:#e8eefb;--mut:#9fb0cf;--pri:#4d8dff;--bd:#27344f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:2.2rem;margin:0 0 4px;color:var(--pri);letter-spacing:.5px}
p.sub{margin:0 0 18px;color:var(--mut)}
.grid{display:grid;gap:18px;grid-template-columns:320px 1fr}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--mut)}
.drop.on{border-color:var(--pri);color:var(--pri)}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 14px;font-size:1rem;font-weight:600}
.btn{background:var(--pri);color:#fff;width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kit{display:block;text-align:center;text-decoration:none;background:var(--acc);color:#fff;width:100%;margin-top:8px;padding:11px 14px;border-radius:8px;font-size:1rem;font-weight:600}
.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd);width:100%;margin-top:8px}
input[type=range]{width:100%}
canvas{width:100%;height:auto;display:block;border-radius:10px;touch-action:none;background:#fff}
.hint{font-size:.8rem;color:var(--mut);margin-top:8px}
</style>
</head>

// Géométrie mesurée sur le modèle (1280x960). Tout est exprimé dans le repère
// pivoté de ANG autour du point PIV : le cadre est alors un rectangle droit.
var REF_W=1280, ANG=6.18*Math.PI/180, PIV={x:387,y:391};
var FRAME={x:171,y:69,w:433,h:611};            // zone blanche de la photo
var CAP={x:152,y:683,w:472,h:42,cx:390,cy:704}; // ligne « NOM ET PRÉNOM »
var BAR="#00439e";

function baseScale(p){return Math.max(FRAME.w/p.naturalWidth,FRAME.h/p.naturalHeight);}
function clampSt(p,st){
  var k=baseScale(p)*st.zoom, mx=Math.max(0,(p.naturalWidth*k-FRAME.w)/2), my=Math.max(0,(p.naturalHeight*k-FRAME.h)/2);
  return {zoom:st.zoom,ox:Math.min(mx,Math.max(-mx,st.ox)),oy:Math.min(my,Math.max(-my,st.oy))};
}
function drawAll(cv,tpl,photo,st,name){
  var s=tpl.naturalWidth/REF_W;
  cv.width=tpl.naturalWidth; cv.height=tpl.naturalHeight;
  var c=cv.getContext('2d');
  c.drawImage(tpl,0,0);
  c.save(); c.scale(s,s); c.translate(PIV.x,PIV.y); c.rotate(ANG); c.translate(-PIV.x,-PIV.y);
  if(photo){
    c.save(); c.beginPath(); c.rect(FRAME.x,FRAME.y,FRAME.w,FRAME.h); c.clip();
    c.fillStyle="#fff"; c.fillRect(FRAME.x,FRAME.y,FRAME.w,FRAME.h);
    var k=baseScale(photo)*st.zoom, w=photo.naturalWidth*k, hh=photo.naturalHeight*k;
    c.drawImage(photo,FRAME.x+FRAME.w/2-w/2+st.ox,FRAME.y+FRAME.h/2-hh/2+st.oy,w,hh);
    c.restore();
  }
  var t=(name||"").trim().toUpperCase();
  if(t){
    c.fillStyle=BAR; c.fillRect(CAP.x,CAP.y,CAP.w,CAP.h);
    var size=36; c.fillStyle="#fff"; c.textAlign="center"; c.textBaseline="alphabetic";
    do{ c.font=size+"px 'Bebas Neue',Impact,sans-serif"; size--; }while(c.measureText(t).width>CAP.w-24&&size>10);
    c.fillText(t,CAP.cx,CAP.cy+size*0.35+4);
  }
  c.restore();
}
// Convertit un delta écran (px canvas affichés) vers le repère local pivoté
function toLocal(dx,dy){var ca=Math.cos(ANG),sa=Math.sin(ANG);return {x:dx*ca+dy*sa,y:-dx*sa+dy*ca};}

function App(){
  var nom=useState(""), prenom=useState("");
  var photoS=useState(null), stS=useState({zoom:1,ox:0,oy:0}), tplS=useState(null), dragO=useState(false);
  var cvRef=useRef(null), drag=useRef(null);
  var photo=photoS[0], st=stS[0], tpl=tplS[0];
  var full=(prenom[0]+" "+nom[0]).trim();

  useEffect(function(){
    var i=new Image(); i.onload=function(){tplS[1](i);};
    i.src=TPL;
    if(document.fonts&&document.fonts.load) document.fonts.load("36px 'Bebas Neue'");
  },[]);
  useEffect(function(){
    if(!tpl||!cvRef.current) return;
    var go=function(){drawAll(cvRef.current,tpl,photo,st,full);};
    go();
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(go);
  },[tpl,photo,st,full]);

  function loadFile(f){
    if(!f||!/^image\//.test(f.type)) return;
    var r=new FileReader();
    r.onload=function(){var i=new Image();i.onload=function(){photoS[1](i);stS[1]({zoom:1,ox:0,oy:0});};i.src=r.result;};
    r.readAsDataURL(f);
  }
  function onDown(e){
    if(!photo) return;
    drag.current={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    if(!drag.current||!photo) return;
    var cv=cvRef.current, r=cv.getBoundingClientRect(), f=cv.width/r.width/(cv.width/REF_W);
    var d=toLocal((e.clientX-drag.current.x)*f,(e.clientY-drag.current.y)*f);
    stS[1](clampSt(photo,{zoom:st.zoom,ox:drag.current.ox+d.x,oy:drag.current.oy+d.y}));
  }
  function onUp(){drag.current=null;}
  function download(){
    cvRef.current.toBlob(function(b){
      var slug=(full||"visuel").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"visuel";
      var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="novembre-bleu-"+slug+".png";a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    },"image/png");
  }
  function reset(){photoS[1](null);stS[1]({zoom:1,ox:0,oy:0});}
  var fileIn=useRef(null);

  return h("div",null,
    h("h1",null,"Novembre Bleu – Mon visuel d'engagement"),
    h("p",{className:"sub"},"Ajoutez votre photo et votre nom, puis téléchargez votre visuel."),
    h("div",{className:"grid"},
      h("div",{className:"card"},
        h("label",null,"Prénom"),
        h("input",{type:"text",value:prenom[0],placeholder:"Ex. Aminata",onChange:function(e){prenom[1](e.target.value);}}),
        h("label",null,"Nom"),
        h("input",{type:"text",value:nom[0],placeholder:"Ex. Koné",onChange:function(e){nom[1](e.target.value);}}),
        h("label",null,"Photo"),
        h("div",{className:"drop"+(dragO[0]?" on":""),
          onClick:function(){fileIn.current.click();},
          onDragOver:function(e){e.preventDefault();dragO[1](true);},
          onDragLeave:function(){dragO[1](false);},
          onDrop:function(e){e.preventDefault();dragO[1](false);loadFile(e.dataTransfer.files[0]);}},
          photo?"Changer la photo":"Déposez une photo ici ou cliquez"),
        h("input",{ref:fileIn,type:"file",accept:"image/*",style:{display:"none"},onChange:function(e){loadFile(e.target.files[0]);}}),
        photo&&h("div",null,
          h("label",null,"Zoom"),
          h("input",{type:"range",min:1,max:3,step:0.01,value:st.zoom,onChange:function(e){stS[1](clampSt(photo,{zoom:+e.target.value,ox:st.ox,oy:st.oy}));}}),
          h("div",{className:"hint"},"Glissez la photo sur l'aperçu pour la recadrer.")),
        h("button",{className:"btn",disabled:!photo,onClick:download},"Télécharger en PNG"),
        h("button",{className:"ghost",onClick:reset},"Réinitialiser"),
        h("a",{className:"kit",href:"https://geniuspay.ci/product/novembre-bleu-2026-nCCEDw",target:"_blank",rel:"noopener noreferrer"},"Acheter un kit")),
      h("div",{className:"card"},
        h("canvas",{ref:cvRef,onPointerDown:onDown,onPointerMove:onMove,onPointerUp:onUp,onPointerCancel:onUp,style:{cursor:photo?"grab":"default"}}))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
