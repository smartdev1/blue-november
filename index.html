<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novembre Bleu – Mon visuel d’engagement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
:root{--bg:#eef3fa;--card:#fff;--text:#0b2a5b;--muted:#5b6b86;--accent:#0047a0;--accent-fg:#fff;--line:#d3ddee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#121e33;--text:#e6eefc;--muted:#9fb0cc;--accent:#4d8dff;--accent-fg:#06142e;--line:#26375a}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#121e33;--text:#e6eefc;--muted:#9fb0cc;--accent:#4d8dff;--accent-fg:#06142e;--line:#26375a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:2.2rem;letter-spacing:.02em;margin:0 0 4px;color:var(--accent)}
.sub{margin:0 0 18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stage{padding:10px}
canvas{display:block;width:100%;height:auto;border-radius:8px}
canvas.drag{cursor:grab;touch-action:none}
canvas.drag:active{cursor:grabbing}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text]{width:100%;padding:11px 12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.field{margin-bottom:18px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--text)}
.btn{display:block;width:100%;padding:12px 14px;border:0;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
</style>
</head>

  function onZoom(e){
    var z = parseFloat(e.target.value);
    setSt(function(p){ return clampSt(photo, { zoom: z, ox: p.ox, oy: p.oy }); });
  }
  function download(){
    setMsg("");
    cvRef.current.toBlob(function(blob){
      var fname = "novembre-bleu-" + ((name || "engagement").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "engagement") + ".png";
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      setMsg("Image enregistrée ✔");
    }, "image/png");
  }
  function reset(){ setPhoto(null); setSt({ zoom: 1, ox: 0, oy: 0 }); setName(""); setMsg(""); if (fileRef.current) fileRef.current.value = ""; }

  return h("div", { className: "wrap" },
    h("h1", null, "Novembre Bleu – Mon visuel d’engagement"),
    h("p", { className: "sub" }, "Ajoutez votre photo et votre nom pour créer votre visuel personnalisé."),
    h("div", { className: "grid" },
      h("div", { className: "card stage" },
        tpl ? h("canvas", { ref: cvRef, className: photo ? "drag" : "", onPointerDown: onDown, onPointerMove: onMove, onPointerUp: onUp, onPointerCancel: onUp, "aria-label": "Aperçu du visuel" })
            : h("p", { className: "hint" }, "Chargement du modèle…")),
      h("div", { className: "card" },
        h("div", { className: "field" },
          h("label", { htmlFor: "nm" }, "Nom et prénom"),
          h("input", { id: "nm", type: "text", value: name, maxLength: 40, placeholder: "Ex. Kouassi Jean", onChange: function(e){ setName(e.target.value); } })),
        h("div", { className: "field" },
          h("label", null, "Votre photo"),
          h("div", { className: "drop" + (over ? " over" : ""), onClick: function(){ fileRef.current.click(); },
              onDragOver: function(e){ e.preventDefault(); setOver(true); }, onDragLeave: function(){ setOver(false); },
              onDrop: function(e){ e.preventDefault(); setOver(false); loadFile(e.dataTransfer.files[0]); } },
            photo ? "Changer de photo" : "Cliquez ou déposez une image ici"),
          h("input", { ref: fileRef, type: "file", accept: "image/*", hidden: true, onChange: function(e){ loadFile(e.target.files[0]); } })),
        h("div", { className: "field" },
          h("label", { htmlFor: "zm" }, "Zoom"),
          h("input", { id: "zm", type: "range", min: 1, max: 3, step: 0.01, value: st.zoom, disabled: !photo, onChange: onZoom }),
          h("p", { className: "hint" }, "Faites glisser la photo sur l’aperçu pour la recadrer.")),
        h("button", { className: "btn", disabled: !photo && !name.trim(), onClick: download }, "Télécharger mon visuel"),
        h("button", { className: "btn sec", onClick: reset }, "Réinitialiser"),
        msg ? h("p", { className: "hint", role: "status" }, msg) : null)));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
